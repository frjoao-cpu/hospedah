name: CI — Validação, Qualidade e Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # 1. Valida HTML com htmlhint
  # ──────────────────────────────────────────────
  validate-html:
    name: Validação HTML
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-htmlhint
          restore-keys: ${{ runner.os }}-npm-

      - name: Instalar htmlhint
        run: npm install -g htmlhint

      - name: Validar HTML
        run: htmlhint "**/*.html" --config .htmlhintrc

  # ──────────────────────────────────────────────
  # 2. Valida JavaScript com ESLint
  # ──────────────────────────────────────────────
  validate-js:
    name: Validação JavaScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-eslint8
          restore-keys: ${{ runner.os }}-npm-

      - name: Instalar ESLint
        run: npm install -g eslint@8

      - name: Validar JavaScript
        run: eslint . --ext .js

  # ──────────────────────────────────────────────
  # 3. Valida CSS com Stylelint
  # ──────────────────────────────────────────────
  validate-css:
    name: Validação CSS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-stylelint
          restore-keys: ${{ runner.os }}-npm-

      - name: Instalar Stylelint
        run: npm install -g stylelint

      - name: Validar CSS
        run: stylelint "**/*.css" --config .stylelintrc.json

  # ──────────────────────────────────────────────
  # 3b. Testa o núcleo do Radar IA (Deno)
  # As Edge Functions rodam em Deno; os algoritmos que
  # decidem dedupe, preço de referência e score ficam em
  # supabase/functions/_shared e são testados aqui.
  # ──────────────────────────────────────────────
  test-radar-core:
    name: Testes do núcleo do Radar IA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Executar testes
        run: deno test supabase/functions/_shared/

  # ──────────────────────────────────────────────
  # 4. Verifica links quebrados com Lychee
  # ──────────────────────────────────────────────
  check-links:
    name: Verificar Links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verificar links em HTML e Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --config .lychee.toml '**/*.html' '**/*.md'
          fail: false

  # ──────────────────────────────────────────────
  # 5. Auditoria de qualidade com Lighthouse CI
  # ──────────────────────────────────────────────
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-lhci
          restore-keys: ${{ runner.os }}-npm-

      - name: Instalar Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Executar Lighthouse CI
        run: lhci autorun

  # ──────────────────────────────────────────────
  # 6. Varredura de segredos com TruffleHog
  # ──────────────────────────────────────────────
  secret-scan:
    name: Varredura de Segredos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog — detectar segredos expostos
        if: github.event_name != 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: HEAD
          extra_args: --only-verified

  # ──────────────────────────────────────────────
  # 7. Publica no GitHub Pages (somente na main)
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy GitHub Pages
    needs: [validate-html, validate-js, validate-css]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-deploy
          restore-keys: ${{ runner.os }}-npm-

      - name: Instalar ferramentas de minificação
        run: npm install -g html-minifier-terser terser csso-cli

      - name: Gerar páginas de resort a partir de data.json
        run: node scripts/generate-resorts.js

      - name: Atualizar data do sitemap
        run: |
          TODAY=$(date +%Y-%m-%d)
          sed -i "s|<lastmod>[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}</lastmod>|<lastmod>${TODAY}</lastmod>|g" sitemap.xml

      - name: Minificar HTML
        run: |
          set -e
          while IFS= read -r f; do
            echo "Minificando: $f"
            html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --remove-optional-tags \
              --remove-redundant-attributes \
              --remove-script-type-attributes \
              -o "$f.min" "$f" && mv "$f.min" "$f"
          done < <(find . -name "*.html" -not -path "./.git/*")

      - name: Minificar CSS
        run: |
          set -e
          for f in style.css assets/style.css assets/index.css assets/mobile-first.css; do
            if [ -f "$f" ]; then
              echo "Minificando: $f"
              csso "$f" -o "$f.min" && mv "$f.min" "$f"
            fi
          done

      - name: Minificar JavaScript
        run: |
          set -e
          for f in script.js sw.js; do
            if [ -f "$f" ]; then
              echo "Minificando: $f"
              terser "$f" -o "$f.min" --compress --mangle && mv "$f.min" "$f"
            fi
          done

      - name: Gerar configuração da IA (placeholder)
        # A chave Gemini NÃO é mais exposta no browser.
        # Todas as chamadas à IA passam pela Supabase Edge Function,
        # que possui a chave configurada como variável de ambiente segura.
        run: |
          echo "window.GEMINI_API_KEY='';" > assets/ai-config.js
          echo "✅ assets/ai-config.js gerado (chave permanece exclusivamente no servidor)"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Fazer upload dos arquivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  # ──────────────────────────────────────────────
  # 8. Deploy Supabase Edge Functions (somente na main)
  # Pré-requisitos (GitHub Secrets):
  #   SUPABASE_ACCESS_TOKEN → Supabase Personal Access Token (formato sbp_…)
  #                           Gere em: https://supabase.com/dashboard/account/tokens
  #   LUNA_API_KEY          → Chave da GPT Luna (IA principal do Radar IA)
  #   GEMINI_API_KEY        → Chave da API Google AI Studio (contingência da IA)
  # ──────────────────────────────────────────────
  deploy-edge-functions:
    name: Deploy Edge Functions (Supabase)
    needs: [validate-html, validate-js, validate-css]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # A checagem do token é só um pré-diagnóstico: uma
      # instabilidade momentânea da API do Supabase (429/5xx)
      # não pode impedir o deploy das Edge Functions. Por isso
      # há retry e, se ainda assim falhar, o job segue e deixa
      # o step de deploy reportar o erro real.
      - name: Validar SUPABASE_ACCESS_TOKEN
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN não configurado como GitHub Secret."
            echo "::error::Gere um Personal Access Token (formato sbp_…) em https://supabase.com/dashboard/account/tokens e adicione em Settings → Secrets and variables → Actions."
            exit 1
          fi
          for attempt in 1 2 3; do
            if supabase projects list > /dev/null 2>&1; then
              echo "✅ SUPABASE_ACCESS_TOKEN válido (tentativa $attempt)."
              exit 0
            fi
            echo "⚠️  A API do Supabase recusou o token na tentativa $attempt."
            sleep $((attempt * 10))
          done
          echo "::warning::Não foi possível validar o SUPABASE_ACCESS_TOKEN (token inválido/expirado ou API instável)."
          echo "::warning::Se o deploy abaixo falhar, gere um novo Personal Access Token em https://supabase.com/dashboard/account/tokens e atualize o GitHub Secret SUPABASE_ACCESS_TOKEN."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # A configuração do secret é uma conveniência: o token
      # SUPABASE_ACCESS_TOKEN pode não ter privilégio de escrita
      # de secrets (erro "does not have the necessary privileges").
      # Isso NÃO pode impedir o deploy das funções — por isso a
      # falha vira aviso e o job segue para os deploys.
      - name: Configurar segredos de IA no Supabase
        run: |
          configurar() {
            nome="$1"
            valor="$2"
            if [ -z "$valor" ]; then
              echo "⚠️  $nome não configurado como GitHub Secret — configure-o manualmente no Supabase (Edge Functions → Secrets)."
              return 0
            fi
            if supabase secrets set "$nome=$valor" --project-ref ydrmjoppjxtmnwtvtinb; then
              echo "✅ Secret $nome configurado no Supabase."
            else
              echo "::warning::Não foi possível gravar o secret $nome via CI (token sem privilégio de escrita de secrets?)."
              echo "::warning::Configure-o manualmente: Supabase Dashboard → Edge Functions → Secrets → $nome."
            fi
          }
          # LUNA_API_KEY é a chave da GPT Luna, IA principal do
          # Radar. GEMINI_API_KEY segue como contingência.
          configurar LUNA_API_KEY "$LUNA_API_KEY"
          configurar GEMINI_API_KEY "$GEMINI_API_KEY"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          LUNA_API_KEY: ${{ secrets.LUNA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Deploy de todas as Edge Functions em um único step
      # resiliente: uma falha individual não impede as demais
      # (o radar-ia sempre é tentado), mas o job falha no final
      # com o resumo das funções que não subiram.
      - name: Deploy Edge Functions
        run: |
          FAILED=""
          for fn in ai-concierge ai-insights lembrete-checkin notificacao-reserva recuperacao-abandono weather radar-ia radar-captura; do
            echo "────────────────────────────────────────"
            echo "🚀 Deploy: $fn"
            echo "────────────────────────────────────────"
            OK=""
            for attempt in 1 2 3; do
              if supabase functions deploy "$fn" --project-ref ydrmjoppjxtmnwtvtinb --no-verify-jwt; then
                echo "✅ $fn implantada (tentativa $attempt)."
                OK="1"
                break
              fi
              echo "⚠️  Falha na tentativa $attempt de deploy de $fn."
              sleep $((attempt * 10))
            done
            if [ -z "$OK" ]; then
              echo "::error::Falha ao fazer deploy da Edge Function $fn."
              FAILED="$FAILED $fn"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo ""
            echo "::error::Falha no deploy das funções:$FAILED"
            echo "::error::Verifique o SUPABASE_ACCESS_TOKEN (privilégios no projeto) e os logs acima."
            exit 1
          fi
          echo ""
          echo "✅ Todas as Edge Functions implantadas com sucesso."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ──────────────────────────────────────────────
  # 9. Smoke tests pós-deploy (somente na main)
  # ──────────────────────────────────────────────
  # Bundle size — controla tamanho das assets críticas
  # ──────────────────────────────────────────────
  bundle-size:
    name: Verificação de Tamanho de Assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verificar tamanho das assets principais
        run: |
          set -e
          # Limite em KB para cada asset crítica
          declare -A LIMITS=(
            ["script.js"]=150
            ["sw.js"]=50
            ["assets/style.css"]=120
            ["assets/index.css"]=80
            ["assets/mobile-first.css"]=60
            ["assets/admin.js"]=500
          )

          FAILED=0
          for FILE in "${!LIMITS[@]}"; do
            if [ -f "$FILE" ]; then
              SIZE_BYTES=$(wc -c < "$FILE")
              SIZE_KB=$(( SIZE_BYTES / 1024 ))
              LIMIT_KB=${LIMITS[$FILE]}
              if [ "$SIZE_KB" -gt "$LIMIT_KB" ]; then
                echo "❌ $FILE: ${SIZE_KB} KB > limite de ${LIMIT_KB} KB"
                FAILED=$((FAILED + 1))
              else
                echo "✅ $FILE: ${SIZE_KB} KB (limite: ${LIMIT_KB} KB)"
              fi
            else
              echo "⚠️  $FILE não encontrado — ignorando"
            fi
          done

          # Relatório total (HTML + CSS + JS)
          TOTAL_HTML=$(find . -name "*.html" -not -path "./.git/*" -exec wc -c {} + 2>/dev/null | awk '/total/{print $1}')
          TOTAL_CSS=$(find . -name "*.css" -not -path "./.git/*" -exec wc -c {} + 2>/dev/null | awk '/total/{print $1}')
          TOTAL_JS=$(find . -name "*.js" -not -path "./.git/*" -not -path "./node_modules/*" -exec wc -c {} + 2>/dev/null | awk '/total/{print $1}')
          echo ""
          echo "📦 Totais do projeto:"
          echo "   HTML: $(( TOTAL_HTML / 1024 )) KB"
          echo "   CSS:  $(( TOTAL_CSS  / 1024 )) KB"
          echo "   JS:   $(( TOTAL_JS   / 1024 )) KB"

          if [ "$FAILED" -gt 0 ]; then
            echo ""
            echo "⚠️  $FAILED asset(s) excederam o limite de tamanho. Considere comprimir ou dividir o arquivo."
            exit 1
          fi

  # ──────────────────────────────────────────────
  # E2E — Playwright (smoke tests locais)
  # ──────────────────────────────────────────────
  e2e-tests:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar testes E2E
        run: npx playwright test
        env:
          CI: true

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ──────────────────────────────────────────────
  # npm audit — segurança das dependências
  # ──────────────────────────────────────────────
  dependency-audit:
    name: Auditoria de Dependências (npm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar npm audit
        # Falha apenas em vulnerabilidades de alto ou crítico impacto
        run: npm audit --audit-level=high

  smoke-test:
    name: Smoke Tests
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Aguardar propagação do deploy
        run: sleep 30

      - name: Verificar páginas críticas
        run: |
          set -e
          URLS=(
            "https://hospedah.tur.br/"
            "https://hospedah.tur.br/busca.html"
            "https://hospedah.tur.br/reservas.html"
            "https://hospedah.tur.br/resorts/hotbeach.html"
            "https://hospedah.tur.br/resorts/ipioca.html"
          )
          FAILED=0
          for url in "${URLS[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url")
            if [ "$STATUS" = "200" ]; then
              echo "✅ $url → HTTP $STATUS"
            else
              echo "❌ $url → HTTP $STATUS"
              FAILED=$((FAILED+1))
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "Smoke tests falharam em $FAILED página(s)"
            exit 1
          fi
